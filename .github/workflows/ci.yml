name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # Action-card provenance gate (design §5.2): every checked-in card must
      # carry its source triple, and the linter must still catch bad cards.
      - name: action-card lint gate
        run: |
          go run ./cmd/hesper cards lint actions
          if go run ./cmd/hesper cards lint internal/actions/testdata/bad; then
            echo "::error::bad-card fixtures passed lint — the linter is broken"
            exit 1
          fi
